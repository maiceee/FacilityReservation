<dialog class="workspace-dialog table-edit-dialog" id="table-edit-dialog" aria-labelledby="table-edit-title" aria-describedby="table-edit-description">
    <header class="workspace-dialog-header">
        <div><h2 id="table-edit-title">Edit record</h2><p id="table-edit-description" class="modal-description"></p></div>
        <button type="button" class="icon-button" data-edit-close aria-label="Close editor">{% include 'Reservation/components/icon.html' with name='x' %}</button>
    </header>
    <div class="workspace-dialog-body" data-edit-body aria-busy="false"></div>
</dialog>

<dialog class="confirm-dialog signout-dialog" id="editor-discard-dialog" aria-labelledby="editor-discard-title" aria-describedby="editor-discard-description">
    <h2 id="editor-discard-title">Discard your changes?</h2>
    <p id="editor-discard-description">Closing the editor discards your current entries. Keep editing to finish, or discard changes to close.</p>
    <div class="dialog-actions">
        <button type="button" class="button button-primary" data-keep-editing autofocus>Keep editing</button>
        <button type="button" class="button" data-discard-edits>Discard changes</button>
    </div>
</dialog>
