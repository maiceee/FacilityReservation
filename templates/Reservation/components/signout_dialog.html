<dialog class="signout-dialog" id="signout-confirmation" aria-labelledby="signout-title" aria-describedby="signout-description">
    <h2 id="signout-title">Sign out of Spasyo?</h2>
    <p id="signout-description">You’ll return to the sign-in page.</p>
    <div class="dialog-actions">
        <button type="button" class="button" data-signout-close autofocus>Stay signed in</button>
        <button type="button" class="button button-primary" data-signout-confirm>Sign out</button>
    </div>
</dialog>
