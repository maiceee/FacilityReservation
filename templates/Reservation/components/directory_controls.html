<div class="directory-controls">
    <nav class="directory-tabs" aria-label="Directory status" data-directory-kind="{{ directory_kind }}">
        {% for tab in directory_tabs %}<a href="{{ tab.url }}" {% if tab.active %}aria-current="page"{% endif %}>{{ tab.label }} <span>{{ tab.count }}</span></a>{% endfor %}
    </nav>
    <form method="get" class="directory-search" role="search">
        <input type="hidden" name="state" value="{{ directory_state }}">
        <label class="sr-only" for="directory-search">Search directory</label>
        <input type="search" id="directory-search" name="search" value="{{ search_query }}" placeholder="Search by name{% if directory_kind == 'facility' %}, code or location{% endif %}…">
        <button type="submit" class="icon-button" aria-label="Search directory">{% include 'Reservation/components/icon.html' with name='search' %}</button>
        {% if search_query %}<a href="?state={{ directory_state }}" class="icon-button" aria-label="Clear search">{% include 'Reservation/components/icon.html' with name='x' %}</a>{% endif %}
    </form>
</div>
<form method="post" action="{% url 'directory_bulk' directory_kind %}" id="directory-bulk" class="directory-bulk" data-bulk-form>
    {% csrf_token %}
    <input type="hidden" name="state" value="{{ directory_state }}">
    <input type="hidden" name="search" value="{{ search_query }}">
    <input type="hidden" name="page" value="{{ page_obj.number }}">
    <span data-selection-count aria-live="polite">Select records on this page</span>
    <button type="submit" name="operation" value="activate" class="button" data-bulk-action>{% include 'Reservation/components/icon.html' with name='circle-check' %}Activate</button>
    <button type="submit" name="operation" value="deactivate" class="button" data-bulk-action>{% include 'Reservation/components/icon.html' with name='circle-x' %}Deactivate</button>
</form>
